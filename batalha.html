<!doctype html>
<html lang="pt-br">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Batalha Naval - Jogos da Família</title>
<link rel="manifest" href="manifest.webmanifest" />
<meta name="theme-color" content="#6a3093" />
<link rel="icon" href="icones/icone-192.png" />
<link rel="apple-touch-icon" href="icones/apple-touch-icon.png" />
<meta name="apple-mobile-web-app-title" content="Jogos" />
<link rel="stylesheet" href="css/style.css?v=3" />
<script>
  if (!localStorage.getItem("ff_user")) {
    window.location.href = "index.html";
  }
</script>
</head>
<body>
<div class="page-wrap">
  <div class="top-bar">
    <h2>🚢 Batalha Naval</h2>
    <div class="actions">
      <button class="btn btn-secondary" id="btnSom" type="button">🔊</button>
      <a class="btn btn-secondary" href="home.html">Menu</a>
      <button class="btn btn-danger" id="btnSair">Sair</button>
    </div>
  </div>

  <div class="game-card">
    <div class="modo-jogo-select">
      <button class="btn btn-secondary" id="btnModoCpuBatalha">Contra o Computador</button>
      <button class="btn btn-secondary" id="btnModoOnlineBatalha">Online (1 x 1)</button>
    </div>

    <!-- Lobby online (convites) -->
    <div id="areaOnlineLobby" style="display: none">
      <div class="online-painel" id="painelConvitesRecebidos" style="display: none">
        <h4>Convites recebidos</h4>
        <div id="listaConvites"></div>
      </div>

      <div class="online-painel">
        <h4>Convidar alguém para jogar</h4>
        <div class="online-linha">
          <select id="selecionarOponente"></select>
          <button class="btn btn-primary" id="btnConvidar">Convidar</button>
        </div>
      </div>

      <div class="online-painel" id="painelAguardando" style="display: none">
        <p class="sala-status" id="textoAguardando"></p>
        <button class="btn btn-danger" id="btnCancelarConvite">Cancelar</button>
      </div>
    </div>

    <!-- Posicionamento dos navios -->
    <div id="areaPosicionamento" style="display: none">
      <p class="sala-status" id="painelEsperaPosicionamento" style="display: none"></p>
      <p>Selecione um navio, escolha a orientação e clique na célula onde ele deve começar.</p>

      <div class="naval-frota" id="frotaBotoes"></div>

      <div class="online-linha" style="justify-content: center">
        <button class="btn btn-secondary" id="btnGirar">Orientação: Horizontal ↔</button>
        <button class="btn btn-secondary" id="btnAleatorio">Posicionar aleatoriamente</button>
        <button class="btn btn-secondary" id="btnReiniciarPosicionamento">Reiniciar</button>
      </div>

      <div class="naval-boards">
        <div class="naval-coluna">
          <h4>Seu tabuleiro</h4>
          <div class="naval-grid" id="gridPosicionamento"></div>
        </div>
      </div>

      <button class="btn btn-primary" id="btnPosPronto" disabled>Pronto para batalhar!</button>
    </div>

    <!-- Batalha -->
    <div id="areaBatalha" style="display: none">
      <div id="onlineInfoBatalha" style="display: none">
        <div class="online-jogadores" id="onlineJogadoresBatalha"></div>
        <div class="placar" id="onlinePlacarBatalha"></div>
      </div>

      <div class="naval-aviso" id="avisoTiro" style="display: none"></div>
      <div class="status-msg" id="statusBatalha"></div>

      <div class="naval-boards">
        <div class="naval-coluna">
          <h4>Seu tabuleiro</h4>
          <div class="naval-grid" id="gridMeu"></div>
          <div class="naval-frota-status" id="frotaStatusMeu"></div>
        </div>
        <div class="naval-coluna">
          <h4>Tabuleiro do inimigo</h4>
          <div class="naval-grid" id="gridInimigo"></div>
          <div class="naval-frota-status" id="frotaStatusInimigo"></div>
        </div>
      </div>

      <div class="naval-legenda">
        <span>🟪 Seu navio</span>
        <span>🟦 Água (errou)</span>
        <span>🟥 Acerto</span>
        <span>⬛ Afundado</span>
      </div>

      <div style="margin-top: 20px">
        <button class="btn btn-primary" id="btnBatalhaNova" style="display: none">Jogar de novo</button>
        <button class="btn btn-secondary" id="btnSairSalaBatalha" style="display: none">Sair da sala</button>
      </div>
    </div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="js/firebase-config.js?v=2"></script>
<script src="js/firebase-init.js?v=2"></script>
<script src="js/auth.js?v=2"></script>
<script src="js/online.js?v=2"></script>
<script src="js/batalha.js?v=3"></script>
<script>
  document.getElementById("btnSair").addEventListener("click", logout);
</script>
</body>
</html>
