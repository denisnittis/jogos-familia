<!doctype html>
<html lang="pt-br">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Show do Milhão - Jogos da Família</title>
<script>
  if (!localStorage.getItem("ff_user")) {
    window.location.href = "index.html";
  }

<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Barlow+Semi+Condensed:wght@500;600;700&display=swap">
<style>
/* Layout: one-screen TV-studio console — prize strip on top, question plate, four numbered answer bars, help dock at the bottom. Deliberately single dark theme (studio at night). */
:root{
  --stage:#0a1440; --stage2:#11205e; --plate:#16297a; --plate-edge:#2f4bc4;
  --gold:#f5c542; --gold-deep:#b8860b; --ink:#f3f5ff; --muted:#9fb0e8;
  --right:#22b35e; --wrong:#d93a3a; --pick:#f08c1c;
  --display:"Bricolage Grotesque",ui-rounded,system-ui,sans-serif;
  --body:"Barlow Semi Condensed","Arial Narrow",system-ui,sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
[hidden]{display:none!important}
body{margin:0;background:radial-gradient(120% 70% at 50% 0%,var(--stage2),var(--stage) 70%) var(--stage);color:var(--ink);font-family:var(--body);font-size:17px;-webkit-tap-highlight-color:transparent;overflow-x:hidden}
.app{min-height:100%;max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:12px;padding-block:12px 16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));box-sizing:border-box}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
button:disabled{cursor:default}
.logo{font-family:var(--display);font-weight:800;line-height:.9;letter-spacing:-.01em;color:var(--gold);text-shadow:0 2px 0 var(--gold-deep),0 0 24px rgba(245,197,66,.35);text-align:center;text-wrap:balance}
.logo small{display:block;font-size:.32em;letter-spacing:.2em;color:var(--ink);text-shadow:none;margin-top:.6em;font-family:var(--body);font-weight:700}
/* start screen */
#start{flex:1;display:flex;flex-direction:column;justify-content:center;gap:24px}
#start .logo{font-size:clamp(52px,16vw,84px)}
.btn-gold{background:linear-gradient(var(--gold),var(--gold-deep));color:#1a1300;font-weight:700;font-size:22px;letter-spacing:.06em;text-transform:uppercase;padding:16px 20px;border-radius:999px;box-shadow:0 4px 0 #7a5806}
.btn-gold:active{transform:translateY(2px);box-shadow:0 2px 0 #7a5806}
.rules{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08);border-radius:14px;padding:14px 16px;color:var(--muted);font-size:15px;line-height:1.4}
.rules b{color:var(--ink)}
.rules p{margin:0 0 6px}.rules p:last-child{margin:0}
.menu-link{display:block;text-align:center;color:var(--muted);font-size:15px;text-decoration:underline;text-underline-offset:3px}
.best{text-align:center;color:var(--muted);font-size:15px}
.board{color:var(--muted);font-size:15px}
.board summary{cursor:pointer;text-align:center;color:var(--gold);padding:6px}
.board>div{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px;margin-top:8px}
.board button{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);border-radius:10px;padding:8px 10px;text-align:left;font-size:14px;color:var(--ink)}
.best b{color:var(--gold);font-variant-numeric:tabular-nums}
/* game */
#game{flex:1;display:flex;flex-direction:column;gap:12px}
.money{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;text-align:center}
.money div{background:rgba(0,0,0,.25);border-radius:10px;padding:6px 4px}
.money span{display:block;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.money b{font-size:18px;font-variant-numeric:tabular-nums}
.money .acertar b{color:var(--gold)}
.qhead{display:flex;justify-content:space-between;align-items:center;font-size:14px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase}
.qhead .links{display:flex;gap:14px}
.qhead button{color:var(--gold);text-decoration:underline;text-underline-offset:3px;letter-spacing:.08em;text-transform:uppercase;font-size:14px;padding:4px 0}
.question{background:linear-gradient(var(--plate),#0f1e5c);border:2px solid var(--plate-edge);border-radius:16px;padding:18px 16px;font-size:clamp(19px,5.4vw,24px);font-weight:700;line-height:1.2;text-align:center;min-height:5.2em;display:flex;align-items:center;justify-content:center;text-wrap:balance;box-shadow:inset 0 1px 0 rgba(255,255,255,.12)}
.answers{display:flex;flex-direction:column;gap:8px}
.ans{display:flex;align-items:center;gap:12px;text-align:left;background:#0d1a52;border:2px solid var(--plate-edge);border-radius:999px;padding:10px 16px 10px 8px;font-size:18px;font-weight:600;line-height:1.15;min-height:52px;transition:background .15s,border-color .15s,opacity .2s}
.ans .n{flex:none;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--gold);color:#1a1300;font-weight:700;font-size:18px}
.ans .t{min-width:0}
.ans.picked{background:var(--pick);border-color:#ffc27a}
.ans.right{background:var(--right);border-color:#7cf0a9}
.ans.wrong{background:var(--wrong);border-color:#ff9c9c}
.ans.gone{opacity:.18;pointer-events:none}
.ans .hint{margin-left:auto;flex:none;font-size:14px;font-weight:700;color:var(--gold);font-variant-numeric:tabular-nums}
.helps{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:auto}
.help{display:flex;flex-direction:column;align-items:center;gap:2px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);border-radius:12px;padding:8px 2px;font-size:13px;font-weight:600;letter-spacing:.04em;text-transform:uppercase}
.help svg{width:26px;height:26px;stroke:var(--gold);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.help:disabled{opacity:.3}
.help .c{font-size:11px;color:var(--muted)}
.stop{background:transparent;border:2px solid var(--muted);color:var(--ink);border-radius:999px;padding:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase}
.stop:disabled{opacity:.3}
/* sheets */
.sheet{position:fixed;inset:0;background:rgba(3,8,30,.78);display:flex;align-items:flex-end;justify-content:center;z-index:20;padding-left:max(0px,env(safe-area-inset-left,0px));padding-right:max(0px,env(safe-area-inset-right,0px))}
.sheet>div{width:100%;max-width:560px;background:var(--stage2);border-top:2px solid var(--gold);border-radius:20px 20px 0 0;padding:20px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));box-sizing:border-box;display:flex;flex-direction:column;gap:14px;max-height:90%;overflow:auto}
.sheet h2{margin:0;font-family:var(--display);font-weight:800;color:var(--gold);font-size:26px;text-align:center;text-wrap:balance}
.sheet p{margin:0;text-align:center;line-height:1.35;color:var(--muted)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn-ghost{border:2px solid var(--muted);border-radius:999px;padding:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.btn-ghost.yes{border-color:var(--gold);color:var(--gold)}
.ladder{display:flex;flex-direction:column-reverse;gap:3px;font-variant-numeric:tabular-nums}
.ladder div{display:flex;justify-content:space-between;padding:5px 12px;border-radius:8px;font-weight:600}
.ladder div.done{color:var(--muted)}
.ladder div.now{background:var(--gold);color:#1a1300}
.ladder div.mil{color:var(--gold)}
.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.card{aspect-ratio:2/3;max-width:100%;border-radius:10px;background:repeating-linear-gradient(45deg,#b02a2a 0 6px,#8c1f1f 6px 12px);border:3px solid #fff;display:grid;place-items:center;font-family:var(--display);font-size:30px;font-weight:800;color:#fff}
.card.open{background:#fff;color:#b02a2a}
.uni{display:flex;flex-direction:column;gap:8px}
.uni div{display:flex;justify-content:space-between;gap:12px;background:rgba(0,0,0,.25);border-radius:10px;padding:10px 14px}
.uni b{color:var(--gold)}
.bars{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;align-items:end;height:150px}
.bar{display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:4px;height:100%;font-weight:700;font-variant-numeric:tabular-nums}
.bar i{display:block;width:70%;background:linear-gradient(var(--gold),var(--gold-deep));border-radius:6px 6px 0 0;min-height:2px;transition:height .6s}
.result-prize{font-family:var(--display);font-weight:800;font-size:44px;color:var(--gold);text-align:center;font-variant-numeric:tabular-nums}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@keyframes pulse{50%{filter:brightness(1.35)}}
.ans.picked{animation:pulse .5s 3}
</style>
</head>
<body>
<div class="app">
  <section id="start">
    <h1 class="logo">Show do Milhão<small>VOLUME 2 · 991 PERGUNTAS</small></h1>
    <div class="rules">
      <p><b>16 perguntas</b> até R$ 1 milhão. Errou, leva metade do que tinha. Na pergunta do milhão, errar zera tudo.</p>
      <p><b>Ajudas:</b> pular (3 vezes), cartas, universitários e placas. Não valem na pergunta do milhão.</p>
    </div>
    <button class="btn-gold" id="play">Jogar</button>
    <a class="menu-link" href="home.html">← Voltar ao menu</a>
    <p class="best" id="best"></p>
    <details class="board" id="board"><summary>Ouvir os sons do jogo</summary><div id="boardList"></div></details>
  </section>

  <section id="game" hidden>
    <div class="money">
      <div class="errar"><span>Errar</span><b id="mErrar"></b></div>
      <div class="parar"><span>Parar</span><b id="mParar"></b></div>
      <div class="acertar"><span>Acertar</span><b id="mAcertar"></b></div>
    </div>
    <div class="qhead"><span id="qnum"></span><span class="links"><button id="mute">Som</button><button id="showLadder">Prêmios</button></span></div>
    <div class="question" id="qtext"></div>
    <div class="answers" id="answers"></div>
    <div class="helps">
      <button class="help" id="hPular"><svg viewBox="0 0 24 24"><path d="M5 5l7 7-7 7M13 5l7 7-7 7"/></svg>Pular<span class="c" id="cPular"></span></button>
      <button class="help" id="hCartas"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="11" height="15" rx="2"/><path d="M10 4l9 2-3 14"/></svg>Cartas<span class="c">1×</span></button>
      <button class="help" id="hUni"><svg viewBox="0 0 24 24"><path d="M2 9l10-5 10 5-10 5z"/><path d="M6 11v5c3 2 9 2 12 0v-5"/></svg>Univers.<span class="c">1×</span></button>
      <button class="help" id="hPlacas"><svg viewBox="0 0 24 24"><path d="M5 20V10M10 20V4M15 20v-7M20 20v-4"/></svg>Placas<span class="c">1×</span></button>
    </div>
    <button class="stop" id="stop">Parar e levar o prêmio</button>
  </section>
</div>
<div class="sheet" id="sheet" hidden><div id="sheetBody"></div></div>

const PRIZES=[1e3,2e3,3e3,4e3,5e3,1e4,2e4,3e4,4e4,5e4,1e5,2e5,3e5,4e5,5e5,1e6];
const LEVEL=i=>i<5?0:i<10?1:i<15?2:3;
const $=id=>document.getElementById(id);
const fmt=v=>v>=1e6?'R$ 1 MILHÃO':'R$ '+v.toLocaleString('pt-BR');
const fmtShort=v=>v>=1e6?'1 milhão':v>=1e3?(v/1e3)+' mil':String(v);
function store(k,v){try{if(v===undefined)return JSON.parse(localStorage.getItem(k));localStorage.setItem(k,JSON.stringify(v))}catch(e){return null}}
const rnd=n=>Math.floor(Math.random()*n);
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=rnd(i+1);[a[i],a[j]]=[a[j],a[i]]}return a};

let S=null; // game state, serializable

// Sounds extracted from the Mega Drive ROM (sons/milhao/sNN.mp3, numbered as in the game's sound table)
const SND={tap:2,blip:0,intro:7,music:18,confirm:9,right:11,wrong:12,cartas:15,placas:14,uni:13,end:4,milhao:35,milhaoMusic:17};
const announceId=i=>19+i; // 19..33 = 1 mil..500 mil, 34 = pergunta do milhão
let actx=null,muted=!!store('smv2-mute'),playing=[],seq=0;
const buffers={};
function unlock(){
  try{if(!actx)actx=new(window.AudioContext||window.webkitAudioContext)();actx.resume()}catch(e){actx=null}
}
function load(id){
  if(!buffers[id])buffers[id]=fetch('sons/milhao/s'+String(id).padStart(2,'0')+'.mp3')
    .then(r=>r.arrayBuffer()).then(b=>new Promise((ok,no)=>actx.decodeAudioData(b,ok,no)));
  return buffers[id];
}
// resolves when the clip ends (or after `fallback` ms when sound is off or fails)
function play(id,{vol=1,fallback=0,force=false}={}){
  return new Promise(async done=>{
    const skip=()=>setTimeout(done,fallback);
    if((muted&&!force)||!actx)return skip();
    try{
      const b=await load(id);if(muted&&!force)return skip();
      const s=actx.createBufferSource(),gn=actx.createGain();
      s.buffer=b;gn.gain.value=vol;s.connect(gn).connect(actx.destination);
      const item={s,done};playing.push(item);
      s.onended=()=>{playing=playing.filter(x=>x!==item);done()};
      s.start();
    }catch(e){skip()}
  });
}
function stopAll(){const p=playing;playing=[];p.forEach(x=>{try{x.s.onended=null;x.s.stop()}catch(e){}x.done()})}
function setMute(m){muted=m;store('smv2-mute',m);if(m)stopAll();$('mute').textContent=m?'Som: desligado':'Som: ligado'}
async function announce(){
  const my=++seq;stopAll();
  await play(announceId(S.i));if(my!==seq||!S||S.locked)return;
  await play(SND.intro);if(my!==seq||!S||S.locked)return;
  play(SND.music,{vol:.45});
}

function draw(lv){
  const seen=new Set(store('smv2-seen')||[]);
  const used=new Set(S?S.asked:[]);
  let pool=Q[lv].map((_,i)=>lv+'-'+i).filter(k=>!used.has(k));
  let fresh=pool.filter(k=>!seen.has(k));
  if(!fresh.length){ // played them all: forget this level's history
    store('smv2-seen',[...seen].filter(k=>!k.startsWith(lv+'-')));fresh=pool;
  }
  const k=fresh[rnd(fresh.length)];
  seen.add(k);store('smv2-seen',[...seen]);
  return k;
}
const cur=()=>{const [lv,i]=S.key.split('-').map(Number);const r=Q[lv][i];return {q:r[0],a:r.slice(1,5),c:r[5],lv}};

function newGame(){
  S={i:0,key:null,asked:[],pular:3,cartas:true,uni:true,placas:true,removed:[],hints:null,locked:false};
  nextQuestion(0);
  $('start').hidden=true;$('game').hidden=false;render();announce();
}
function nextQuestion(i){
  S.i=i;S.key=draw(LEVEL(i));S.asked.push(S.key);S.removed=[];S.hints=null;S.locked=false;
}
function money(){
  const i=S.i,acc=i?PRIZES[i-1]:0;
  return {acertar:PRIZES[i],parar:acc,errar:i===15?0:Math.floor(acc/2)};
}
function render(){
  const m=money(),c=cur(),mil=S.i===15;
  $('mErrar').textContent=fmtShort(m.errar);$('mParar').textContent=fmtShort(m.parar);$('mAcertar').textContent=fmtShort(m.acertar);
  $('qnum').textContent=mil?'Pergunta do milhão':`Pergunta ${S.i+1} de 16 · valendo ${fmt(m.acertar)}`;
  $('qtext').textContent=c.q;
  const box=$('answers');box.innerHTML='';
  c.a.forEach((t,k)=>{
    const b=document.createElement('button');b.className='ans';b.id='ans'+k;
    if(S.removed.includes(k))b.classList.add('gone');
    b.innerHTML=`<span class="n">${k+1}</span><span class="t"></span>`;
    b.querySelector('.t').textContent=t;
    if(S.hints&&S.hints[k]!=null){const h=document.createElement('span');h.className='hint';h.textContent=S.hints[k];b.append(h)}
    b.onclick=()=>confirmAnswer(k);box.append(b);
  });
  $('cPular').textContent=S.pular+'×';
  $('hPular').disabled=mil||!S.pular||S.locked;
  $('hCartas').disabled=mil||!S.cartas||S.locked;
  $('hUni').disabled=mil||!S.uni||S.locked;
  $('hPlacas').disabled=mil||!S.placas||S.locked;
  $('stop').disabled=S.locked;
}
function sheet(html,setup){$('sheetBody').innerHTML=html;$('sheet').hidden=false;setup&&setup($('sheetBody'))}
function closeSheet(){$('sheet').hidden=true}

function confirmAnswer(k){
  if(S.locked)return;
  const c=cur();seq++;stopAll();play(SND.confirm);
  sheet(`<h2>Está certo disso?</h2><p>Resposta ${k+1}: <b style="color:var(--ink)"></b></p>
    <div class="row"><button class="btn-ghost" id="no">Não</button><button class="btn-ghost yes" id="yes">Sim, certeza</button></div>`,el=>{
    el.querySelector('p b').textContent=c.a[k];
    el.querySelector('#no').onclick=()=>{stopAll();closeSheet();play(SND.music,{vol:.45})};
    el.querySelector('#yes').onclick=()=>{closeSheet();answer(k)};
  });
}
function answer(k){
  S.locked=true;seq++;stopAll();render();
  const c=cur(),m=money();
  $('ans'+k).classList.add('picked');
  setTimeout(async()=>{
    $('ans'+k).classList.remove('picked');
    $('ans'+c.c).classList.add('right');
    if(k!==c.c){$('ans'+k).classList.add('wrong');await play(SND.wrong,{fallback:1400});end('errou',m.errar,c.a[c.c]);return}
    await play(SND.right,{fallback:1200});
    if(S.i===15)return end('milhao',1e6);
    nextQuestion(S.i+1);render();announce();
  },1500);
}
function end(kind,prize,rightText){
  const best=store('smv2-best')||0;if(prize>best)store('smv2-best',prize);
  const title={errou:'Que pena!',parou:'Parou!',milhao:'Você ganhou 1 milhão!'}[kind];
  const sub=kind==='errou'?'A resposta certa era: ':kind==='parou'?`Parou na pergunta ${S.i+1}.`:'Acertou todas as 16 perguntas.';
  S=null;seq++;stopAll();
  if(kind==='milhao')play(SND.milhao).then(()=>play(SND.milhaoMusic));else play(SND.end);
  sheet(`<h2>${title}</h2><p></p><div class="result-prize">${fmt(prize)}</div>
    <div class="row"><button class="btn-ghost" id="menu">Início</button><button class="btn-ghost yes" id="again">Jogar de novo</button></div>`,el=>{
    const p=el.querySelector('p');p.textContent=sub;
    if(rightText){const b=document.createElement('b');b.style.color='var(--ink)';b.textContent=rightText;p.append(b)}
    el.querySelector('#menu').onclick=()=>{stopAll();closeSheet();home()};
    el.querySelector('#again').onclick=()=>{stopAll();closeSheet();newGame()};
  });
}
function home(){
  S=null;$('game').hidden=true;$('start').hidden=false;
  const b=store('smv2-best');$('best').innerHTML=b?`Seu recorde: <b>${fmt(b)}</b>`:'';
}

$('play').onclick=()=>{unlock();newGame()};
$('mute').onclick=()=>{unlock();setMute(!muted)};setMute(muted);
$('stop').onclick=()=>{
  const m=money();
  sheet(`<h2>Quer parar?</h2><p>Você leva ${fmt(m.parar)}.</p>
    <div class="row"><button class="btn-ghost" id="no">Continuar</button><button class="btn-ghost yes" id="yes">Parar</button></div>`,el=>{
    el.querySelector('#no').onclick=closeSheet;
    el.querySelector('#yes').onclick=()=>{closeSheet();end('parou',m.parar)};
  });
};
$('showLadder').onclick=()=>{
  sheet(`<h2>Prêmios</h2><div class="ladder">${PRIZES.map((v,i)=>`<div class="${i<S.i?'done':i===S.i?'now':''} ${i===15?'mil':''}"><span>${i+1}</span><span>${fmt(v)}</span></div>`).join('')}</div>
    <button class="btn-ghost yes" id="ok">Voltar</button>`,el=>el.querySelector('#ok').onclick=closeSheet);
};
$('hPular').onclick=()=>{S.pular--;play(SND.blip);nextQuestion(S.i);render();announce()};
$('hCartas').onclick=()=>{
  seq++;stopAll();play(SND.cartas);
  const deck=shuffle([['K',0],['A',1],['2',2],['3',3]]);
  sheet(`<h2>Escolha uma carta</h2><p>Rei não tira nenhuma. Ás tira uma, 2 tira duas e 3 tira três respostas erradas.</p>
    <div class="cards">${deck.map((_,i)=>`<button class="card" data-i="${i}" aria-label="Carta ${i+1}"></button>`).join('')}</div>`,el=>{
    el.querySelectorAll('.card').forEach(b=>b.onclick=()=>{
      if(!S.cartas)return;S.cartas=false;
      el.querySelectorAll('.card').forEach((x,i)=>{x.textContent=deck[i][0];x.classList.add('open');if(x!==b)x.style.opacity=.35});
      const n=deck[b.dataset.i][1],c=cur();
      S.removed=shuffle([0,1,2,3].filter(k=>k!==c.c)).slice(0,n);
      el.querySelector('p').textContent=n?`Saíram ${n} resposta${n>1?'s':''} errada${n>1?'s':''}.`:'Que azar, deu Rei. Nenhuma resposta saiu.';
      setTimeout(()=>{closeSheet();render();stopAll();play(SND.music,{vol:.45})},1600);
    });
  });
};
function guess(acc){ // one person's guess: right with prob acc, otherwise a random remaining wrong answer
  const c=cur(),left=[0,1,2,3].filter(k=>!S.removed.includes(k)&&k!==c.c);
  return Math.random()<acc||!left.length?c.c:left[rnd(left.length)];
}
$('hUni').onclick=()=>{
  S.uni=false;seq++;stopAll();play(SND.uni);const unanimous=Math.random()<[.7,.5,.35][cur().lv];
  const names=['Estudante de Letras','Estudante de História','Estudante de Exatas'];
  const c=cur(),g=shuffle([c.c,c.c,unanimous?c.c:guess(0)]); // at least 2 of 3 always right
  sheet(`<h2>Universitários</h2><div class="uni">${names.map((n,i)=>`<div><span>${n}</span><b>Resposta ${g[i]+1}</b></div>`).join('')}</div>
    <button class="btn-ghost yes" id="ok">Voltar à pergunta</button>`,el=>el.querySelector('#ok').onclick=()=>{stopAll();closeSheet();play(SND.music,{vol:.45})});
  S.hints=[null,null,null,null];g.forEach(k=>S.hints[k]=(S.hints[k]||0)+1);S.hints=S.hints.map(v=>v?v+'×':null);render();
};
$('hPlacas').onclick=()=>{
  S.placas=false;seq++;stopAll();play(SND.placas);const votes=[0,0,0,0],right=cur().c;
  votes[right]=51+rnd([40,30,20][cur().lv]); // the right answer always gets the majority
  for(let i=votes[right];i<100;i++)votes[guess(0)]++;
  sheet(`<h2>Placas</h2><p>O que a plateia respondeu:</p><div class="bars">${votes.map((v,k)=>`<div class="bar"><span>${v}%</span><i style="height:0"></i><span>${k+1}</span></div>`).join('')}</div>
    <button class="btn-ghost yes" id="ok">Voltar à pergunta</button>`,el=>{
    requestAnimationFrame(()=>requestAnimationFrame(()=>el.querySelectorAll('.bar i').forEach((b,k)=>b.style.height=votes[k]*0.8+'%')));
    el.querySelector('#ok').onclick=()=>{stopAll();closeSheet();play(SND.music,{vol:.45})};
  });
  S.hints=votes.map(v=>v+'%');render();
};

const BOARD=[...Array(15)].map((_,i)=>['Pergunta de '+fmtShort(PRIZES[i]),19+i]).concat([
  ['Pergunta do milhão',34],['Início da pergunta',7],['Música da pergunta',18],['Confirmar resposta',9],
  ['Resposta certa',11],['Resposta errada',12],['Cartas',15],['Placas',14],['Universitários',13],
  ['Ganhou 1 milhão',35],['Música do milhão',17],['Fim de jogo',4],['Menu de ajuda',10],
  ['Outra fala 1',5],['Outra fala 2',6],['Outra fala 3',8],['Outra fala 4',16],
  ['Efeito 1',0],['Efeito 2',1],['Efeito 3',2],['Efeito 4',3]]);
BOARD.forEach(([label,id])=>{
  const b=document.createElement('button');b.textContent=label;
  b.onclick=()=>{unlock();stopAll();play(id,{force:true})};
  $('boardList').append(b);
});

home();
</script>
