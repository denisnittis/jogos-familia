<!doctype html>
<html lang="pt-br">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Jogo da Velha - Jogos da Família</title>
<link rel="manifest" href="manifest.webmanifest" />
<meta name="theme-color" content="#6a3093" />
<link rel="icon" href="icones/icone-192.png" />
<link rel="apple-touch-icon" href="icones/apple-touch-icon.png" />
<meta name="apple-mobile-web-app-title" content="Jogos" />
<link rel="stylesheet" href="css/style.css?v=3" />
<script>
  if (!localStorage.getItem("ff_user")) {
    window.location.href = "index.html";
  }
</script>
</head>
<body>
<div class="page-wrap">
  <div class="top-bar">
    <h2>❌⭕ Jogo da Velha</h2>
    <div class="actions">
      <a class="btn btn-secondary" href="home.html">Menu</a>
      <button class="btn btn-danger" id="btnSair">Sair</button>
    </div>
  </div>

  <div class="game-card">
    <div class="modo-select">
      <button class="btn btn-secondary" id="btnModo2p">2 Jogadores</button>
      <button class="btn btn-secondary" id="btnModoCpu">Contra o Computador</button>
      <button class="btn btn-secondary" id="btnModoOnline">Online (1 x 1)</button>
    </div>

    <!-- Modos Local / CPU -->
    <div id="areaLocal">
      <div class="velha-nivel" id="nivelCpu" style="display: none">
        <button type="button" data-nivel="facil">😊 Fácil</button>
        <button type="button" data-nivel="medio">🙂 Médio</button>
        <button type="button" data-nivel="impossivel">😈 Impossível</button>
      </div>

      <div class="placar">
        <span><span id="rotuloPlacarX">❌</span> <span id="placarX">0</span></span>
        <span><span id="rotuloPlacarO">⭕</span> <span id="placarO">0</span></span>
        <span>🤝 <span id="placarEmpate">0</span></span>
      </div>

      <div class="status-msg" id="status"></div>

      <div class="velha-board" id="board"></div>

      <button class="btn btn-primary" id="btnNovo">Nova partida</button>
    </div>

    <!-- Modo Online: lobby -->
    <div id="areaOnlineLobby" style="display: none">
      <div class="online-painel" id="painelConvitesRecebidos" style="display: none">
        <h4>Convites recebidos</h4>
        <div id="listaConvites"></div>
      </div>

      <div class="online-painel">
        <h4>Convidar alguém para jogar</h4>
        <div class="online-linha">
          <select id="selecionarOponente"></select>
          <button class="btn btn-primary" id="btnConvidar">Convidar</button>
        </div>
      </div>

      <div class="online-painel" id="painelAguardando" style="display: none">
        <p class="sala-status" id="textoAguardando"></p>
        <button class="btn btn-danger" id="btnCancelarConvite">Cancelar</button>
      </div>
    </div>

    <!-- Modo Online: partida em andamento -->
    <div id="areaOnlineJogo" style="display: none">
      <div class="online-jogadores" id="onlineJogadores"></div>
      <div class="placar" id="onlinePlacar"></div>
      <div class="status-msg" id="statusOnline"></div>

      <div class="velha-board" id="boardOnline"></div>

      <div style="margin-top: 20px">
        <button class="btn btn-primary" id="btnNovaOnline" style="display: none">Jogar de novo</button>
        <button class="btn btn-secondary" id="btnSairSala">Sair da sala</button>
      </div>
    </div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="js/firebase-config.js?v=2"></script>
<script src="js/firebase-init.js?v=2"></script>
<script src="js/auth.js?v=2"></script>
<script src="js/online.js?v=2"></script>
<script src="js/velha.js?v=2"></script>
<script>
  document.getElementById("btnSair").addEventListener("click", logout);
</script>
</body>
</html>
